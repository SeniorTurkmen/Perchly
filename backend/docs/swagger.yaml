      - persona-traits
    get:
      description: Kullanıcının bu persona için özelleştirdiği (veya henüz özelleştirmediyse
        persona varsayılanı) warmth/humor/wisdom/directness/energy değerleri.
      parameters:
      - description: Persona ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.personaTraitsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Kişilik dial'larını getir
      tags:
      - persona-traits
