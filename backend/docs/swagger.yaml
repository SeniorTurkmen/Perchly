        okunmaz, age_range''den türetilir. preferred_name/skip_hitap opsiyoneldir:
        hiçbiri gönderilmezse eski istemci davranışı değişmez; skip_hitap=true ise
        preferred_name her zaman NULL''a zorlanır (sunucu asla takma ad üretmez);
        skip_hitap=false iken preferred_name boşsa 400 döner. Bilinmeyen alanlar yok
