basePath: /
definitions:
  internal_handler.chatEnergyResponse:
    properties:
      limit:
        type: integer
      mood_label:
        type: string
      remaining:
        type: integer
      used:
        type: integer
    type: object
  internal_handler.completeRegistrationRequest:
    properties:
      display_name:
        type: string
    type: object
  internal_handler.createAnonymousSessionRequest:
    properties:
      device_id:
        type: string
      timezone:
        description: |-
          IANA timezone (e.g. "Europe/Istanbul"), used to reset daily quotas
          at the user's local midnight. Optional; defaults to UTC. Ignored
          for a returning device_id — timezone is set once, at creation.
        type: string
    type: object
  internal_handler.createAnonymousSessionResponse:
    properties:
      access_token:
        type: string
      has_completed_onboarding:
        description: |-
          HasCompletedOnboarding lets the client decide whether to show
          onboarding without a separate round trip — see
          service.SessionTokens.HasCompletedOnboarding for why this can't
          just be a client-local flag.
        type: boolean
      is_anonymous:
        type: boolean
      refresh_token:
        type: string
      user_id:
        type: string
    type: object
  internal_handler.createConversationRequest:
    properties:
      persona_id:
        type: string
    type: object
  internal_handler.createMessageRequest:
    properties:
      content:
        type: string
    type: object
  internal_handler.errorResponse:
    properties:
      code:
        $ref: '#/definitions/perchly-backend_internal_apierror.Code'
      error:
        type: string
    type: object
  internal_handler.logoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  internal_handler.personaTraitsResponse:
    properties:
      is_customized:
        type: boolean
      traits:
        $ref: '#/definitions/perchly-backend_internal_model.PersonaTraits'
    type: object
  internal_handler.refreshSessionRequest:
    properties:
      refresh_token:
        type: string
    type: object
  internal_handler.requestEmailCodeRequest:
    properties:
      email:
        type: string
    type: object
  internal_handler.saveOnboardingProfileRequest:
    properties:
      age_range:
        type: string
      mood_preference:
        type: string
      notifications_granted:
        type: boolean
      preferred_name:
        description: |-
          PreferredName/SkipHitap are pointers deliberately: nil means the
          field was absent (an older client), which OnboardingService needs
          to tell apart from an explicit empty string / false — see its
          SaveProfile doc comment.
        type: string
      selected_persona_id:
        type: string
      skip_hitap:
        type: boolean
    type: object
  internal_handler.sessionResponse:
    properties:
      access_token:
        type: string
      has_completed_onboarding:
        description: |-
          HasCompletedOnboarding lets the client decide whether to show
          onboarding without a separate round trip — see
          service.SessionTokens.HasCompletedOnboarding for why this can't
          just be a client-local flag.
        type: boolean
      refresh_token:
        type: string
    type: object
  internal_handler.setPersonaTraitsRequest:
    properties:
      directness:
        type: integer
      energy:
        type: integer
      humor:
        type: integer
      warmth:
        type: integer
      wisdom:
        type: integer
    type: object
  internal_handler.setReactionRequest:
    properties:
      emoji:
        type: string
    type: object
  internal_handler.verifyEmailCodeRequest:
    properties:
      access_token:
        description: |-
          AccessToken is the caller's current anonymous session's access
          token, if any — see AuthService.VerifyEmailCode's Durum A/B split.
        type: string
      code:
        type: string
      email:
        type: string
    type: object
  internal_handler.verifyEmailCodeResponse:
    properties:
      access_token:
        type: string
      has_completed_onboarding:
        description: |-
          HasCompletedOnboarding lets the client decide whether to show
          onboarding without a separate round trip — see
          service.SessionTokens.HasCompletedOnboarding for why this can't
          just be a client-local flag.
        type: boolean
      is_new_registration:
        type: boolean
      refresh_token:
        type: string
    type: object
  perchly-backend_internal_apierror.Code:
    enum:
    - invalid_request_body
    - unauthorized
    - internal_error
    - session_create_failed
    - invalid_email
    - email_code_send_failed
    - too_many_attempts
    - verification_code_expired
    - invalid_verification_code
    - verification_failed
    - invalid_display_name
    - user_not_found
    - profile_update_failed
    - invalid_refresh_token
    - session_refresh_failed
    - logout_failed
    - invalid_persona_id
    - persona_not_found
    - persona_fetch_failed
    - personas_list_failed
    - persona_not_age_appropriate
    - persona_trait_out_of_range
    - persona_traits_failed
    - invalid_conversation_id
    - conversation_not_found
    - conversation_forbidden
    - conversation_create_failed
    - conversations_list_failed
    - conversation_fetch_failed
    - conversation_context_missing
    - messages_list_failed
    - invalid_message_id
    - message_not_found
    - message_content_required
    - message_send_failed
    - streaming_unsupported
    - reaction_emoji_required
    - invalid_reaction_emoji
    - cannot_react_to_own_message
    - reaction_failed
    - invalid_age_range
    - invalid_mood_preference
    - invalid_selected_persona_id
    - preferred_name_required
    - preferred_name_invalid
    - onboarding_save_failed
    - onboarding_fetch_failed
    - onboarding_profile_not_found
    - quota_check_failed
    - quota_exceeded
    - chat_energy_failed
    type: string
    x-enum-varnames:
    - CodeInvalidRequestBody
    - CodeUnauthorized
    - CodeInternal
    - CodeSessionCreateFailed
    - CodeInvalidEmail
    - CodeEmailCodeSendFailed
    - CodeTooManyAttempts
    - CodeVerificationExpired
    - CodeInvalidCode
    - CodeVerificationFailed
    - CodeInvalidDisplayName
    - CodeUserNotFound
    - CodeProfileUpdateFailed
    - CodeInvalidRefreshToken
    - CodeSessionRefreshFailed
    - CodeLogoutFailed
    - CodeInvalidPersonaID
    - CodePersonaNotFound
    - CodePersonaFetchFailed
    - CodePersonasListFailed
    - CodePersonaNotAgeAppropriate
    - CodePersonaTraitOutOfRange
    - CodePersonaTraitsFailed
    - CodeInvalidConversationID
    - CodeConversationNotFound
    - CodeConversationForbidden
    - CodeConversationCreateFailed
    - CodeConversationsListFailed
    - CodeConversationFetchFailed
    - CodeConversationContextMissing
    - CodeMessagesListFailed
    - CodeInvalidMessageID
    - CodeMessageNotFound
    - CodeMessageContentRequired
    - CodeMessageSendFailed
    - CodeStreamingUnsupported
    - CodeReactionEmojiRequired
    - CodeInvalidReactionEmoji
    - CodeCannotReactToOwnMessage
    - CodeReactionFailed
    - CodeInvalidAgeRange
    - CodeInvalidMoodPreference
    - CodeInvalidSelectedPersonaID
    - CodePreferredNameRequired
    - CodePreferredNameInvalid
    - CodeOnboardingSaveFailed
    - CodeOnboardingFetchFailed
    - CodeOnboardingProfileNotFound
    - CodeQuotaCheckFailed
    - CodeQuotaExceeded
    - CodeChatEnergyFailed
  perchly-backend_internal_model.Conversation:
    properties:
      created_at:
        type: string
      id:
        type: string
      persona_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  perchly-backend_internal_model.ConversationPreview:
    properties:
      created_at:
        type: string
      id:
        type: string
      last_message:
        $ref: '#/definitions/perchly-backend_internal_model.Message'
      persona:
        $ref: '#/definitions/perchly-backend_internal_model.Persona'
      persona_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  perchly-backend_internal_model.HealthResponse:
    properties:
      database:
        type: string
      status:
        type: string
    type: object
  perchly-backend_internal_model.Message:
    properties:
      content:
        type: string
      conversation_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      reaction_emoji:
        description: |-
          ReactionEmoji is the single emoji reaction left on this message by
          whichever side didn't send it (the user reacting to an assistant
          message, or the persona reacting to a user message — see
          ChatService.SendMessage), or nil if none. Always one of
          OrderedAllowedReactionEmojis.
        type: string
      role:
        $ref: '#/definitions/perchly-backend_internal_model.MessageRole'
    type: object
  perchly-backend_internal_model.MessageRole:
    enum:
    - user
    - assistant
    type: string
    x-enum-varnames:
    - MessageRoleUser
    - MessageRoleAssistant
  perchly-backend_internal_model.OnboardingProfile:
    properties:
      age_range:
        description: |-
          One of "under18", "age18to24", "age25to34", "age35plus" — matches
          the iOS OnboardingProfile.AgeRange enum's case names exactly.
        type: string
      created_at:
        type: string
      is_minor:
        description: |-
          Always recomputed server-side from AgeRange (see
          OnboardingService.SaveProfile) — never trusted verbatim from the
          client, since persona age-gating depends on it.
        type: boolean
      mood_preference:
        description: One of "motivation", "dailyChat", "hobbyTalk", "skipped", or
          nil.
        type: string
      notifications_granted:
        type: boolean
      preferred_name:
        description: |-
          PreferredName is exactly what the user typed for how they want to
          be addressed — never a server-generated nickname. nil means no
          hitap has been set (either they opted out via SkipHitap, or
          they're on a client version that doesn't send this yet).
        type: string
      selected_persona_id:
        type: string
      skip_hitap:
        description: |-
          SkipHitap is true when the user explicitly chose to stay
          anonymous — personas must never address them by any name,
          nickname, or invented handle in that case (see
          ContextBuilder.formatHitapInstruction).
        type: boolean
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  perchly-backend_internal_model.Persona:
    properties:
      accent_color:
        type: string
      avatar_url:
        type: string
      category:
        type: string
      created_at:
        type: string
      default_traits:
        allOf:
        - $ref: '#/definitions/perchly-backend_internal_model.PersonaTraits'
        description: |-
          DefaultTraits are this persona's own personality dial positions —
          what a user gets before they've ever customized anything for it.
          See PersonaTraits and user_persona_traits.
      id:
        type: string
      is_active:
        type: boolean
      is_minor_appropriate:
        description: |-
          IsMinorAppropriate gates whether a user flagged as a minor (see
          OnboardingProfile.IsMinor) may start a conversation with this
          persona — enforced in ConversationService.Create.
        type: boolean
      name:
        type: string
      short_description:
        type: string
      slug:
        type: string
      sort_order:
        type: integer
      tone_description:
        type: string
      updated_at:
        type: string
    type: object
  perchly-backend_internal_model.PersonaTraits:
    properties:
      directness:
        description: |-
          Directness: how blunt/unsoftened vs. gentle and hedged its
          responses are — this is the dial behind "harsher answers".
        type: integer
      energy:
        description: 'Energy: how energetic/enthusiastic vs. calm and measured its
          tone is.'
        type: integer
      humor:
        description: 'Humor: how often and readily it jokes vs. stays fully serious.'
        type: integer
      warmth:
        description: 'Warmth: how affectionate/close vs. distant and formal the persona
          is.'
        type: integer
      wisdom:
        description: 'Wisdom: how deep/reflective vs. surface-level its responses
          are.'
        type: integer
    type: object
info:
  contact: {}
  description: |-
    Perchly sohbet uygulamasının REST API'si — kimlik doğrulama, onboarding, persona, konuşma/mesajlaşma ve kota uçları.
    Kimlik doğrulama gerektiren uçlar için "Authorize" düğmesinden `Bearer <access_token>` girin.
  title: Perchly Backend API
  version: "1.0"
paths:
  /auth/anonymous:
    post:
      consumes:
      - application/json
      description: device_id'ye göre yeni bir anonim kullanıcı oluşturur veya var
        olanı döner. Gövde opsiyoneldir.
      parameters:
      - description: device_id ve opsiyonel IANA timezone
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_handler.createAnonymousSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.createAnonymousSessionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Anonim oturum oluştur
      tags:
      - auth
  /auth/email/request-code:
    post:
      consumes:
      - application/json
      description: E-postaya bir doğrulama kodu gönderir. Kayıtlı olup olmadığına
        bakılmaksızın her zaman aynı genel başarı cevabını döner.
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.requestEmailCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: E-posta doğrulama kodu isteği
      tags:
      - auth
  /auth/email/verify-code:
    post:
      consumes:
      - application/json
      description: Kodu doğrular; access_token dolu gönderilirse mevcut anonim oturumu
        aynı user_id ile e-postalı hesaba yükseltir (Durum B), boşsa/olmayan bir e-postaysa
        yeni hesap açar (Durum A).
      parameters:
      - description: email, code, opsiyonel access_token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.verifyEmailCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.verifyEmailCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: E-posta doğrulama kodunu doğrula
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Verilen refresh token'ı iptal eder.
      parameters:
      - description: refresh_token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.logoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Çıkış yap
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh token ile yeni bir access/refresh token çifti üretir.
      parameters:
      - description: refresh_token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.refreshSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.sessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Oturumu yenile
      tags:
      - auth
  /auth/register/complete:
    post:
      consumes:
      - application/json
      description: users.display_name'i yalnızca bu uç yazar — onboarding'deki preferred_name
        (hitap) ile karıştırılmaz.
      parameters:
      - description: display_name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.completeRegistrationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Kayıt sonrası görünen adı belirle
      tags:
      - auth
  /conversations:
    get:
      description: Çağıranın gelen kutusu, en son etkinliğe göre sıralı.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/perchly-backend_internal_model.ConversationPreview'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Konuşmaları listele
      tags:
      - conversations
    post:
      consumes:
      - application/json
      description: Sahibi her zaman kimlik doğrulanan çağırandır; client tarafından
        belirlenemez. Reşit olmayan kullanıcı is_minor_appropriate=false bir personayla
        konuşma açamaz.
      parameters:
      - description: persona_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/perchly-backend_internal_model.Conversation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: persona yaş grubuna uygun değil
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Yeni konuşma başlat
      tags:
      - conversations
  /conversations/{id}/messages:
    get:
      description: Salt okunur; kota harcamaz. Sahiplik kontrolü sunucu tarafında
        yapılır.
      parameters:
      - description: Conversation ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/perchly-backend_internal_model.Message'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Konuşmadaki mesajları listele
      tags:
      - conversations
    post:
      consumes:
      - application/json
      description: 'Başarılı olursa cevap Server-Sent Events''e döner: her LLM chunk''ı
        için bir "message" event''i, persona kullanıcı mesajına tepki verdiyse tek
        bir "reaction" event''i, ve sonunda gerçek/persisted id''leri taşıyan bir
        "done" event''i (doneEventPayload); akış sırasında hata olursa "error" event''i
        gelir. Kota QuotaMiddleware tarafından bu uçtan önce kontrol edilir; günlük
        limit dolmuşsa ve kredi de yoksa 429 döner.'
      parameters:
      - description: Conversation ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createMessageRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'text/event-stream: message/reaction/done/error event''leri'
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "429":
          description: günlük kota doldu ve kredi yok
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Mesaj gönder (SSE stream)
      tags:
      - conversations
  /conversations/{id}/messages/{messageID}/reaction:
    delete:
      parameters:
      - description: Conversation ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Message ID (UUID)
        in: path
        name: messageID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/perchly-backend_internal_model.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Mesajdaki emoji tepkisini kaldır
      tags:
      - conversations
    post:
      consumes:
      - application/json
      description: Yalnızca çağıranın sahip olduğu konuşmadaki asistan mesajlarına
        tepki bırakılabilir.
      parameters:
      - description: Conversation ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Message ID (UUID)
        in: path
        name: messageID
        required: true
        type: string
      - description: emoji
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.setReactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/perchly-backend_internal_model.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
