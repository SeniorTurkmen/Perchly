  /users/onboarding-profile:
    get:
      description: Yeniden kurulum veya ikinci bir cihazda daha önce verilen onboarding
        cevaplarını senkronize etmek için kullanılır.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/perchly-backend_internal_model.OnboardingProfile'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: onboarding henüz tamamlanmamış
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Onboarding profilini getir
      tags:
      - onboarding
    post:
      consumes:
